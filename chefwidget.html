<!DOCTYPE html>
<html lang="en">
<head>
<!-- Staffbase brand color via ?brand= URL param (sb-brand-url-param) -->
<script>(function(){try{var b=new URLSearchParams(location.search).get('brand');if(b&&/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/.test(b)){document.documentElement.style.setProperty('--sb-brand',b);}}catch(e){}})();</script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="widget-name" content="My Kitchen Today">
<meta name="widget-description" content="Aged care chef's shift, next service, resident numbers, dietary alerts and daily services on a single screen">
<meta name="widget-tags" content="Operations, Safety">
<title>My Kitchen Today</title>

<style>
    :root {
        --primary: var(--sb-brand, #2563eb);
        --success: #10b981;
        --warning: #f59e0b;
        --danger: #ef4444;
        --text: #1f2937;
        --text-light: #6b7280;
        --bg: #ffffff;
        --bg-gray: #f9fafb;
        --border: #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --primary: var(--sb-brand, #3b9eff);
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --text: #f3f4f6;
            --text-light: #9ca3af;
            --bg: #1f2937;
            --bg-gray: #111827;
            --border: #374151;
        }
    }

    * { box-sizing: border-box; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg); color: var(--text); margin: 0; padding: 16px;
        -webkit-font-smoothing: antialiased;
    }
    .widget { width: 100%; max-width: 480px; margin: 0 auto; }

    .cw-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .cw-head-title { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
    .cw-chip {
        font-size: 12px; font-weight: 600; color: var(--primary);
        background: color-mix(in srgb, var(--primary) 12%, transparent);
        padding: 4px 10px; border-radius: 20px; white-space: nowrap; flex-shrink: 0;
    }

    .shift-card {
        background: var(--bg-gray); border-radius: 12px; padding: 12px 14px;
        display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px;
    }
    .shift-label { font-size: 12px; color: var(--text-light); margin-bottom: 3px; }
    .shift-time { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
    .cw-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
    .handover { text-align: right; flex-shrink: 0; }
    .handover-label { font-size: 11px; color: var(--text-light); margin-bottom: 3px; }
    .handover-time { font-size: 15px; font-weight: 700; color: var(--primary); }

    .stat-strip { display: flex; gap: 10px; margin-bottom: 14px; }
    .stat { flex: 1; background: var(--bg-gray); border-radius: 12px; padding: 11px 13px; }
    .stat-label { font-size: 11px; color: var(--text-light); margin-bottom: 4px; }
    .stat-value { font-size: 19px; font-weight: 700; line-height: 1; }
    .stat-sub { font-size: 11px; color: var(--text-light); margin-top: 3px; }

    .cw-section-heading {
        font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: var(--text-light);
        text-transform: uppercase; margin-bottom: 6px;
    }

    /* Dietary alerts: only block not present in the original widget */
    .diet-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .diet-row .cw-chip b { font-weight: 700; margin-right: 4px; }
    .diet-row .cw-chip.diet-alert {
        color: var(--danger);
        background: color-mix(in srgb, var(--danger) 12%, transparent);
    }

    .round { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
    .round:last-child { border-bottom: none; }
    .round-time {
        font-size: 12px; font-weight: 700; color: var(--primary); width: 44px; flex-shrink: 0;
    }
    .round-name { font-size: 14px; flex: 1; min-width: 0; }
    .round-loc { font-size: 12px; color: var(--text-light); white-space: nowrap; }

    .cw-btn {
        border: none; font-family: inherit; cursor: pointer; font-weight: 600; font-size: 14px;
        padding: 12px; border-radius: 10px; background: var(--primary); color: #fff; width: 100%;
        margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .cw-btn:hover { filter: brightness(0.93); }
</style>
</head>

<body>

<div class="widget">
    <div class="cw-head">
        <span class="cw-head-title" id="headDate"></span>
        <span class="cw-chip" id="unitChip"></span>
    </div>

    <div class="shift-card">
        <div>
            <div class="shift-label" id="shiftLabel"></div>
            <div class="shift-time"><span class="cw-dot"></span><span id="shiftTime"></span></div>
        </div>
        <div class="handover">
            <div class="handover-label" id="handoverLabel"></div>
            <div class="handover-time" id="handoverTime"></div>
        </div>
    </div>

    <div class="stat-strip">
        <div class="stat">
            <div class="stat-label" id="resLabel"></div>
            <div class="stat-value" id="resValue"></div>
            <div class="stat-sub" id="resSub"></div>
        </div>
        <div class="stat">
            <div class="stat-label" id="staffLabel"></div>
            <div class="stat-value" id="staffValue"></div>
            <div class="stat-sub" id="staffSub"></div>
        </div>
    </div>

    <div class="cw-section-heading" id="dietHeading"></div>
    <div class="diet-row" id="dietList"></div>

    <div class="cw-section-heading" id="roundsHeading"></div>
    <div id="roundList"></div>

    <button class="cw-btn" id="incidentBtn"><span>⚠</span><span id="incidentLabel"></span></button>
</div>

<script>
    const LANG = (() => {
        const l = navigator.language || '';
        if (l.startsWith('de')) return 'de';
        if (l.startsWith('fr')) return 'fr';
        if (l.startsWith('es')) return 'es';
        if (l.startsWith('ja')) return 'ja';
        if (l === 'en-AU')      return 'en-AU';
        if (l === 'en-GB')      return 'en-GB';
        return 'en-US';
    })();
    document.documentElement.lang = LANG;

    const LOCALE = { 'de':'de-DE','fr':'fr-FR','es':'es-ES','ja':'ja-JP','en-AU':'en-AU','en-GB':'en-GB','en-US':'en-US' }[LANG];
    const LANG_SUFFIX = { 'de':'De','fr':'Fr','es':'Es','ja':'Ja','en-AU':'','en-GB':'','en-US':'' }[LANG];
    const loc = (o, base) => o[base + LANG_SUFFIX] ?? o[base];

    const EN = {
        onShift:'On shift', next:'Next service', residents:'Residents today', residentsSub:'in care today',
        staff:'Kitchen team', staffSub:'on shift', diet:'Dietary alerts', rounds:'My services today',
        reportIncident:'Report food safety incident'
    };
    const T = {
        de: { onShift:'Im Dienst', next:'Nächster Service', residents:'Bewohner heute', residentsSub:'in Betreuung',
              staff:'Küchenteam', staffSub:'im Dienst', diet:'Ernährungshinweise', rounds:'Meine Services heute',
              reportIncident:'Lebensmittelsicherheit melden' },
        fr: { onShift:'En service', next:'Prochain service', residents:'Résidents du jour', residentsSub:'pris en charge',
              staff:'Équipe cuisine', staffSub:'en service', diet:'Alertes alimentaires', rounds:'Mes services du jour',
              reportIncident:'Signaler un incident alimentaire' },
        es: { onShift:'En turno', next:'Próximo servicio', residents:'Residentes hoy', residentsSub:'en el centro',
              staff:'Equipo de cocina', staffSub:'en turno', diet:'Alertas dietéticas', rounds:'Mis servicios de hoy',
              reportIncident:'Reportar incidente alimentario' },
        ja: { onShift:'勤務中', next:'次の提供', residents:'本日の入居者', residentsSub:'入居中',
              staff:'調理スタッフ', staffSub:'勤務中', diet:'食事アラート', rounds:'本日の提供スケジュール',
              reportIncident:'食品安全インシデント報告' },
        'en-AU': EN, 'en-GB': EN, 'en-US': EN
    };
    const t = T[LANG] || EN;

    const UNIT = 'Main Kitchen';
    const SHIFT = '05:30 – 13:30';
    const NEXT_SERVICE = '12:00';
    const RESIDENTS = 96, STAFF = 4, STAFF_TARGET = 5;

    // Texture-modified diets follow IDDSI levels; counts are placeholders
    const DIETS = [
        { n:9, alert:false, label:'IDDSI 4 Pureed', labelDe:'IDDSI 4 Püriert', labelFr:'IDDSI 4 Mixé', labelEs:'IDDSI 4 Triturado', labelJa:'IDDSI 4 ピューレ' },
        { n:7, alert:false, label:'IDDSI 5 Minced & moist', labelDe:'IDDSI 5 Fein zerkleinert', labelFr:'IDDSI 5 Haché et humide', labelEs:'IDDSI 5 Picado y húmedo', labelJa:'IDDSI 5 刻み・とろみ' },
        { n:4, alert:true,  label:'Nut allergy', labelDe:'Nussallergie', labelFr:'Allergie aux noix', labelEs:'Alergia a frutos secos', labelJa:'ナッツアレルギー' },
        { n:3, alert:true,  label:'Coeliac', labelDe:'Zöliakie', labelFr:'Cœliaque', labelEs:'Celiaquía', labelJa:'セリアック病' },
        { n:6, alert:false, label:'Diabetic', labelDe:'Diabetiker', labelFr:'Diabétique', labelEs:'Diabético', labelJa:'糖尿病食' }
    ];

    const SERVICES = [
        { time:'07:30', name:'Breakfast service', nameDe:'Frühstück', nameFr:'Petit-déjeuner', nameEs:'Servicio de desayuno', nameJa:'朝食提供',
          loc:'96 residents', locDe:'96 Bewohner', locFr:'96 résidents', locEs:'96 residentes', locJa:'入居者96名' },
        { time:'09:00', name:'Fridge & freezer temp log', nameDe:'Kühltemperatur-Protokoll', nameFr:'Relevé températures froid', nameEs:'Registro de temperaturas', nameJa:'冷蔵・冷凍温度記録',
          loc:'Cool room', locDe:'Kühlraum', locFr:'Chambre froide', locEs:'Cámara fría', locJa:'冷蔵室' },
        { time:'10:00', name:'Morning tea', nameDe:'Vormittagstee', nameFr:'Collation du matin', nameEs:'Merienda de mañana', nameJa:'午前のお茶',
          loc:'All wings', locDe:'Alle Flügel', locFr:'Toutes les ailes', locEs:'Todas las alas', locJa:'全棟' },
        { time:'12:00', name:'Lunch service', nameDe:'Mittagessen', nameFr:'Service du déjeuner', nameEs:'Servicio de almuerzo', nameJa:'昼食提供',
          loc:'Dining room', locDe:'Speisesaal', locFr:'Salle à manger', locEs:'Comedor', locJa:'食堂' }
    ];

    function applySBBrand() {
        var sb = getComputedStyle(document.documentElement).getPropertyValue('--sb-brand').trim();
        if (sb) { document.documentElement.style.setProperty('--primary', sb); return; }
        try {
            sb = window.parent.getComputedStyle(window.parent.document.documentElement).getPropertyValue('--sb-brand').trim();
            if (sb) document.documentElement.style.setProperty('--primary', sb);
        } catch (e) {}
    }

    function render() {
        document.getElementById('headDate').textContent =
            new Intl.DateTimeFormat(LOCALE, { weekday:'long', day:'numeric', month:'short' }).format(new Date());
        document.getElementById('unitChip').textContent = UNIT;

        document.getElementById('shiftLabel').textContent = t.onShift;
        document.getElementById('shiftTime').textContent = SHIFT;
        document.getElementById('handoverLabel').textContent = t.next;
        document.getElementById('handoverTime').textContent = NEXT_SERVICE;

        document.getElementById('resLabel').textContent = t.residents;
        document.getElementById('resValue').textContent = RESIDENTS;
        document.getElementById('resSub').textContent = t.residentsSub;

        document.getElementById('staffLabel').textContent = t.staff;
        document.getElementById('staffValue').textContent = STAFF + '/' + STAFF_TARGET;
        document.getElementById('staffSub').textContent = t.staffSub;

        document.getElementById('dietHeading').textContent = t.diet;
        document.getElementById('dietList').innerHTML = DIETS.map(function(d) {
            return '<span class="cw-chip' + (d.alert ? ' diet-alert' : '') + '"><b>' + d.n + '</b>' + loc(d, 'label') + '</span>';
        }).join('');

        document.getElementById('roundsHeading').textContent = t.rounds;
        document.getElementById('roundList').innerHTML = SERVICES.map(function(r) {
            return '<div class="round">' +
                '<span class="round-time">' + r.time + '</span>' +
                '<span class="round-name">' + loc(r, 'name') + '</span>' +
                '<span class="round-loc">' + loc(r, 'loc') + '</span>' +
                '</div>';
        }).join('');

        document.getElementById('incidentLabel').textContent = t.reportIncident;
    }

    document.addEventListener('DOMContentLoaded', function() { applySBBrand(); render(); });
</script>

</body>
</html>
