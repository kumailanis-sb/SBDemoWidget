<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="widget-description" content="Recognize colleagues with cards tagged to service values. Build a culture of peer appreciation.">
<meta name="widget-name" content="Peer Shoutouts">
<title>Peer Shoutouts</title>
<style>
  :root {
    --primary: #143c8c;
    --bg: #f4f6fa;
    --surface: #ffffff;
    --text: #1a2233;
    --muted: #6b7280;
    --border: #e5e7eb;
    --radius: 14px;
    --shadow: 0 1px 3px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06);
    --shadow-sm: 0 1px 2px rgba(16,24,40,.08);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .widget {
    max-width: 100%;
    margin: 32px auto;
    padding: 0 40px 60px;
  }

  /* ---- Header ---- */
  .cw-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .cw-header h1 {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -.02em;
    margin: 0;
  }
  .cw-icon-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: var(--primary);
    color: #fff;
    font-size: 26px;
    line-height: 1;
    cursor: pointer;
    display: grid;
    place-items: center;
    box-shadow: var(--shadow-sm);
    transition: transform .12s ease, filter .12s ease;
  }
  .cw-icon-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .cw-icon-btn:active { transform: translateY(0); }
  .cw-header-actions { display: flex; align-items: center; gap: 10px; }
  .cw-reset {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all .12s ease;
  }
  .cw-reset:hover { border-color: #f0a6a6; color: #ef4444; }
  .cw-reset[hidden] { display: none; }

  /* ---- Hero ---- */
  .hero {
    background: linear-gradient(135deg, var(--primary), #1f57c4);
    color: #fff;
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
  }
  .hero-label {
    text-transform: uppercase;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .14em;
    opacity: .85;
    margin-bottom: 14px;
  }
  .hero-row { display: flex; gap: 16px; align-items: flex-start; }
  .hero-avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 18px;
    color: #fff;
    flex-shrink: 0;
    box-shadow: 0 0 0 3px rgba(255,255,255,.25);
  }
  .hero-body { flex: 1; min-width: 0; }
  .hero-name { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .hero-value {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    background: rgba(255,255,255,.18) !important;
    color: #fff !important;
    margin-bottom: 12px;
  }
  .hero-story { font-size: 15.5px; line-height: 1.55; font-style: italic; }
  .hero-from { margin-top: 10px; font-size: 13px; opacity: .85; }

  /* ---- Tabs ---- */
  .cw-tabs {
    display: flex;
    gap: 4px;
    background: #eceff5;
    padding: 4px;
    border-radius: 12px;
    margin-bottom: 22px;
  }
  .cw-tab {
    flex: 1;
    border: none;
    background: transparent;
    padding: 9px 12px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .cw-tab:hover { color: var(--text); }
  .cw-tab.active {
    background: var(--surface);
    color: var(--primary);
    box-shadow: var(--shadow-sm);
  }

  /* ---- Feed (2-row horizontal scroll) ---- */
  .feed {
    display: grid;
    grid-auto-flow: column;
    grid-template-rows: repeat(2, auto);
    grid-auto-columns: 380px;
    align-items: stretch;
    gap: 16px;
    overflow-x: auto;
    overflow-y: hidden;
    padding-bottom: 14px;
    scroll-snap-type: x proximity;
    scrollbar-width: thin;
    scrollbar-color: #c3c9d6 transparent;
  }
  .feed::-webkit-scrollbar { height: 10px; }
  .feed::-webkit-scrollbar-track { background: transparent; }
  .feed::-webkit-scrollbar-thumb {
    background: #c3c9d6;
    border-radius: 999px;
    border: 2px solid var(--bg);
  }
  .feed::-webkit-scrollbar-thumb:hover { background: #a9b1c2; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    scroll-snap-align: start;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .card-header { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    flex-shrink: 0;
  }
  .card-meta { min-width: 0; }
  .card-from { font-size: 13.5px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .card-from .to { color: var(--muted); font-weight: 400; }
  .card-time { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .card-value {
    align-self: flex-start;
    padding: 4px 11px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .card-story {
    font-size: 14.5px;
    line-height: 1.55;
    margin: 0 0 14px;
  }
  .card-footer { display: flex; margin-top: auto; }
  .reaction {
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    transition: all .12s ease;
  }
  .reaction:hover { border-color: #f0a6c2; color: #ec4899; }
  .reaction.on {
    background: #ec48991a;
    border-color: #f4b9d1;
    color: #ec4899;
  }

  /* ---- Card image thumbnail ---- */
  .card-thumb {
    width: 100%;
    height: 130px;
    object-fit: cover;
    border-radius: 10px;
    margin: 0 0 16px;
    cursor: zoom-in;
    display: block;
    background: #eceff5;
    transition: filter .12s ease;
  }
  .card-thumb:hover { filter: brightness(.94); }

  /* ---- Lightbox ---- */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(16,24,40,.82);
    display: grid;
    place-items: center;
    padding: 32px;
    z-index: 300;
    cursor: zoom-out;
    animation: fadeIn .15s ease;
  }
  .lightbox[hidden] { display: none; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .lightbox img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 12px;
    box-shadow: 0 24px 64px rgba(0,0,0,.5);
    animation: pop .18s ease;
  }
  .lightbox-close {
    position: absolute;
    top: 20px;
    right: 24px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,.15);
    color: #fff;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: background .12s ease;
  }
  .lightbox-close:hover { background: rgba(255,255,255,.28); }

  .empty {
    grid-row: 1 / -1;
    text-align: center;
    color: var(--muted);
    padding: 48px 24px;
    font-size: 15px;
    white-space: nowrap;
  }

  /* ---- Modal ---- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(16,24,40,.5);
    display: grid;
    place-items: center;
    padding: 20px;
    z-index: 100;
  }
  .modal-backdrop[hidden] { display: none; }
  .modal {
    background: var(--surface);
    border-radius: 18px;
    padding: 26px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 24px 64px rgba(16,24,40,.28);
    animation: pop .18s ease;
  }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal h3 { margin: 0 0 18px; font-size: 20px; font-weight: 800; }
  .modal label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin: 16px 0 7px;
  }
  .modal select, .modal textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: var(--surface);
  }
  .modal select:focus, .modal textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(20,60,140,.12);
  }
  .modal textarea { min-height: 92px; resize: vertical; }

  .image-field { margin-top: 7px; }
  .image-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    border: 1px dashed var(--border);
    background: var(--surface);
    color: var(--muted);
    border-radius: 10px;
    padding: 9px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all .12s ease;
  }
  .image-btn:hover { border-color: var(--primary); color: var(--primary); }
  .image-preview {
    position: relative;
    margin-top: 10px;
    display: none;
  }
  .image-preview.show { display: block; }
  .image-preview img {
    width: 100%;
    max-height: 180px;
    object-fit: cover;
    border-radius: 10px;
    display: block;
  }
  .image-remove {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: none;
    background: rgba(16,24,40,.72);
    color: #fff;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    display: grid;
    place-items: center;
  }
  .image-remove:hover { background: rgba(16,24,40,.9); }

  .value-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .value-pill {
    border: 1.5px solid var(--border);
    background: var(--surface);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    text-align: left;
    transition: all .12s ease;
  }
  .value-pill:hover { border-color: var(--v); }
  .value-pill.selected {
    border-color: var(--v);
    background: color-mix(in srgb, var(--v) 12%, white);
    color: var(--v);
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 24px;
  }
  .cw-btn {
    border: none;
    border-radius: 10px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all .12s ease;
  }
  .cw-btn-secondary { background: #eceff5; color: var(--text); }
  .cw-btn-secondary:hover { background: #e0e4ec; }
  .cw-btn-primary { background: var(--primary); color: #fff; }
  .cw-btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
  .cw-btn-primary:disabled { opacity: .45; cursor: not-allowed; }

  /* ---- Toast ---- */
  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: #fff;
    padding: 12px 22px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 8px 24px rgba(16,24,40,.28);
    z-index: 200;
    animation: toastIn .25s ease;
  }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }

  /* ---- Responsive ---- */
  @media (max-width: 620px) {
    .feed { grid-auto-columns: 82%; }
    .value-grid { grid-template-columns: 1fr; }
    .widget { margin: 16px auto; }
  }
</style>
</head>
<body>
  <div class="widget">
    <div class="cw-header">
      <h1 data-i18n="title">Peer Shoutouts</h1>
      <div class="cw-header-actions">
        <button class="cw-reset" id="reset-cards" title="Clear cards you've added" hidden>Reset</button>
        <button class="cw-icon-btn" id="open-send" data-i18n-title="send" title="Send">+</button>
      </div>
    </div>

    <div class="hero" id="hero"></div>

    <div class="cw-tabs">
      <button class="cw-tab active" data-tab="recent" data-i18n="tabRecent">Recent</button>
      <button class="cw-tab" data-tab="sent" data-i18n="tabSent">Sent</button>
      <button class="cw-tab" data-tab="received" data-i18n="tabReceived">Received</button>
    </div>

    <div class="feed" id="feed"></div>
  </div>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <h3 data-i18n="modalTitle">Send a Shoutout</h3>
      <label data-i18n="recipient">Recipient</label>
      <select id="recipient"></select>
      <label data-i18n="value">Service Value</label>
      <div class="value-grid" id="value-grid"></div>
      <label data-i18n="story">Your Story</label>
      <textarea id="story" data-i18n-placeholder="storyPlaceholder" placeholder="What inspired you?"></textarea>
      <label data-i18n="photo">Photo (optional)</label>
      <div class="image-field">
        <button type="button" class="image-btn" id="pick-image">📷 <span data-i18n="addPhoto">Add a photo</span></button>
        <input type="file" id="image-input" accept="image/*" hidden>
        <div class="image-preview" id="image-preview">
          <img id="image-preview-img" alt="Preview">
          <button type="button" class="image-remove" id="image-remove" title="Remove">×</button>
        </div>
      </div>
      <div class="modal-actions">
        <button class="cw-btn cw-btn-secondary" id="cancel-send" data-i18n="cancel">Cancel</button>
        <button class="cw-btn cw-btn-primary" id="confirm-send" data-i18n="send" disabled>Send</button>
      </div>
    </div>
  </div>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" id="lightbox-close" title="Close">×</button>
    <img id="lightbox-img" alt="Shoutout photo">
  </div>

  <script>
    // --- Language detection ---
    const LANG = (() => {
      const l = navigator.language || '';
      if (l.startsWith('de')) return 'de';
      if (l.startsWith('fr')) return 'fr';
      if (l.startsWith('es')) return 'es';
      if (l.startsWith('ja')) return 'ja';
      if (l === 'en-GB')      return 'en-GB';
      return 'en-US';
    })();
    document.documentElement.lang = LANG;

    // --- Translations ---
    const T = {
      de: {
        title: 'Kollegen-Lob', tabRecent: 'Aktuell', tabSent: 'Gesendet', tabReceived: 'Erhalten',
        send: 'Senden', cancel: 'Abbrechen', modalTitle: 'Lob senden',
        recipient: 'Empfänger', value: 'Servicewert', story: 'Deine Geschichte',
        storyPlaceholder: 'Was hat dich beeindruckt?', shoutoutOfWeek: 'Lob der Woche',
        photo: 'Foto (optional)', addPhoto: 'Foto hinzufügen',
        thanks: 'Lob gesendet', empty: 'Noch keine Karten',
        valueGuests: 'Gäste-Leidenschaft', valueSustainable: 'Nachhaltige Leistung',
        valueConquest: 'Eroberungsgeist', valueInnovation: 'Innovation',
        valueTrust: 'Vertrauen', valueRespect: 'Respekt',
        timeNow: 'gerade eben', timeMinAgo: 'vor ${n} Min.', timeHrAgo: 'vor ${n} Std.', timeDayAgo: 'vor ${n} T.',
      },
      fr: {
        title: 'Reconnaissance', tabRecent: 'Récents', tabSent: 'Envoyés', tabReceived: 'Reçus',
        send: 'Envoyer', cancel: 'Annuler', modalTitle: 'Envoyer une reconnaissance',
        recipient: 'Destinataire', value: 'Valeur de service', story: 'Votre message',
        storyPlaceholder: "Qu'est-ce qui vous a inspiré ?", shoutoutOfWeek: 'Reconnaissance de la semaine',
        photo: 'Photo (facultatif)', addPhoto: 'Ajouter une photo',
        thanks: 'Reconnaissance envoyée', empty: 'Aucune carte',
        valueGuests: 'Passion pour les clients', valueSustainable: 'Performance durable',
        valueConquest: 'Esprit de conquête', valueInnovation: 'Innovation',
        valueTrust: 'Confiance', valueRespect: 'Respect',
        timeNow: "à l'instant", timeMinAgo: 'il y a ${n} min', timeHrAgo: 'il y a ${n} h', timeDayAgo: 'il y a ${n} j',
      },
      es: {
        title: 'Reconocimientos', tabRecent: 'Recientes', tabSent: 'Enviados', tabReceived: 'Recibidos',
        send: 'Enviar', cancel: 'Cancelar', modalTitle: 'Enviar reconocimiento',
        recipient: 'Destinatario', value: 'Valor de servicio', story: 'Tu mensaje',
        storyPlaceholder: '¿Qué te inspiró?', shoutoutOfWeek: 'Reconocimiento de la semana',
        photo: 'Foto (opcional)', addPhoto: 'Añadir una foto',
        thanks: 'Reconocimiento enviado', empty: 'Sin tarjetas todavía',
        valueGuests: 'Pasión por los huéspedes', valueSustainable: 'Rendimiento sostenible',
        valueConquest: 'Espíritu de conquista', valueInnovation: 'Innovación',
        valueTrust: 'Confianza', valueRespect: 'Respeto',
        timeNow: 'ahora mismo', timeMinAgo: 'hace ${n} min', timeHrAgo: 'hace ${n} h', timeDayAgo: 'hace ${n} d',
      },
      ja: {
        title: '称賛カード', tabRecent: '最近', tabSent: '送信済み', tabReceived: '受信済み',
        send: '送信', cancel: 'キャンセル', modalTitle: '称賛を送る',
        recipient: '宛先', value: 'サービス価値', story: 'メッセージ',
        storyPlaceholder: '何に感動しましたか？', shoutoutOfWeek: '今週の称賛',
        photo: '写真（任意）', addPhoto: '写真を追加',
        thanks: '称賛を送信しました', empty: 'カードはまだありません',
        valueGuests: 'お客様への情熱', valueSustainable: '持続可能なパフォーマンス',
        valueConquest: '挑戦の精神', valueInnovation: 'イノベーション',
        valueTrust: '信頼', valueRespect: '尊重',
        timeNow: 'たった今', timeMinAgo: '${n}分前', timeHrAgo: '${n}時間前', timeDayAgo: '${n}日前',
      },
      'en-GB': {
        title: 'Peer Shoutouts', tabRecent: 'Recent', tabSent: 'Sent', tabReceived: 'Received',
        send: 'Send', cancel: 'Cancel', modalTitle: 'Send a Shoutout',
        recipient: 'Recipient', value: 'Service Value', story: 'Your Story',
        storyPlaceholder: 'What inspired you?', shoutoutOfWeek: 'Shoutout of the Week',
        photo: 'Photo (optional)', addPhoto: 'Add a photo',
        thanks: 'Shoutout sent', empty: 'No cards yet',
        valueGuests: 'Passion for Guests', valueSustainable: 'Sustainable Performance',
        valueConquest: 'Spirit of Conquest', valueInnovation: 'Innovation',
        valueTrust: 'Trust', valueRespect: 'Respect',
        timeNow: 'just now', timeMinAgo: '${n} min ago', timeHrAgo: '${n} hr ago', timeDayAgo: '${n} d ago',
      },
      'en-US': {
        title: 'Peer Shoutouts', tabRecent: 'Recent', tabSent: 'Sent', tabReceived: 'Received',
        send: 'Send', cancel: 'Cancel', modalTitle: 'Send a Shoutout',
        recipient: 'Recipient', value: 'Service Value', story: 'Your Story',
        storyPlaceholder: 'What inspired you?', shoutoutOfWeek: 'Shoutout of the Week',
        photo: 'Photo (optional)', addPhoto: 'Add a photo',
        thanks: 'Shoutout sent', empty: 'No cards yet',
        valueGuests: 'Passion for Guests', valueSustainable: 'Sustainable Performance',
        valueConquest: 'Spirit of Conquest', valueInnovation: 'Innovation',
        valueTrust: 'Trust', valueRespect: 'Respect',
        timeNow: 'just now', timeMinAgo: '${n} min ago', timeHrAgo: '${n} hr ago', timeDayAgo: '${n} d ago',
      },
    };
    const t = T[LANG] ?? T['en-US'];

    function tr(key, vars) {
      let s = t[key] || key;
      if (vars) for (const k in vars) s = s.replace('${' + k + '}', vars[k]);
      return s;
    }

    const LANG_SUFFIX = { 'de': 'De', 'fr': 'Fr', 'es': 'Es', 'ja': 'Ja', 'en-GB': '', 'en-US': '' };
    function loc(obj, key) {
      const sfx = LANG_SUFFIX[LANG] || '';
      return (sfx ? obj[key + sfx] : undefined) || obj[key];
    }

    // --- Date helpers ---
    const now = new Date();
    const hoursAgo = n => new Date(now.getTime() - n * 3600000);
    const daysAgo = n => new Date(now.getTime() - n * 86400000);

    function timeLabel(date) {
      const diff = (now - date) / 1000;
      if (diff < 60) return t.timeNow;
      if (diff < 3600) return tr('timeMinAgo', { n: Math.floor(diff / 60) });
      if (diff < 86400) return tr('timeHrAgo', { n: Math.floor(diff / 3600) });
      return tr('timeDayAgo', { n: Math.floor(diff / 86400) });
    }

    // --- Service values ---
    const VALUES = [
      { id: 'guests',      key: 'valueGuests',      color: '#ec4899', icon: '★' },
      { id: 'sustainable', key: 'valueSustainable', color: '#10b981', icon: '✿' },

    // --- Persistence (localStorage) ---
    // Seed cards above stay read-only. User-created cards are stored separately
    // under this key and merged on top at load, so a "reset" is just clearing it.
    const STORE_KEY = 'peerShoutouts.userCards';

    function loadUserCards() {
      try {
        const raw = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
        // Revive: JSON turns Dates into strings, so rebuild them.
        return raw.map(c => ({ ...c, when: new Date(c.when) }));
      } catch (e) {
        return [];
      }
    }

    function saveUserCards() {
      try {
        // Persist only user-created cards (those not in the original seed set).
        const userCards = CARDS.filter(c => c.userCreated);
        localStorage.setItem(STORE_KEY, JSON.stringify(userCards));
      } catch (e) {
        // QuotaExceededError means the image(s) pushed us over the ~5MB cap —
        // rethrow so the caller can notify. Other errors (blocked storage in a
        // sandboxed iframe) fail silently; cards still work in-memory.
        if (e && e.name === 'QuotaExceededError') throw e;
      }
    }

    // Merge any previously saved cards on top of the seed data (newest first).
    (function restoreCards() {
      const saved = loadUserCards();
      if (saved.length) CARDS.unshift(...saved);
    })();

    // --- State ---
    let activeTab = 'recent';
    let selectedValue = null;

    // --- Helpers ---
    function initials(name) {
      return name.split(' ').map(p => p[0] || '').join('').slice(0, 2).toUpperCase();
    }
    const AVATAR_COLORS = ['#ec4899','#8b5cf6','#3b82f6','#10b981','#0ea5e9','#f59e0b','#ef4444','#14b8a6'];
    function avatarColor(name) {
      let h = 0;
      for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
      return AVATAR_COLORS[h % AVATAR_COLORS.length];
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function applyTranslations() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (t[key] !== undefined) el.textContent = t[key];
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.dataset.i18nPlaceholder;
        if (t[key] !== undefined) el.placeholder = t[key];
      });
      document.querySelectorAll('[data-i18n-title]').forEach(el => {
        const key = el.dataset.i18nTitle;
        if (t[key] !== undefined) el.title = t[key];
      });
    }

    // --- Render ---
    function renderHero() {
      const c = CARDS.find(x => x.hero) || CARDS[0];
      const v = valueOf(c.value);
      document.getElementById('hero').innerHTML = `
        <div class="hero-label">${escapeHtml(t.shoutoutOfWeek)}</div>
        <div class="hero-row">
          <div class="hero-avatar" style="background:${avatarColor(c.to)}">${escapeHtml(initials(c.to))}</div>
          <div class="hero-body">
            <div class="hero-name">${escapeHtml(c.to)}</div>
            <div class="hero-value">${v.icon} ${escapeHtml(t[v.key])}</div>
            <div class="hero-story">"${escapeHtml(loc(c, 'story'))}"</div>
            <div class="hero-from">— ${escapeHtml(c.from)}</div>
          </div>
        </div>
      `;
    }

    function renderFeed() {
      let cards = CARDS.slice();
      if (activeTab === 'sent') cards = cards.filter(c => c.from === ME);
      if (activeTab === 'received') cards = cards.filter(c => c.to === ME);

      const feed = document.getElementById('feed');
      if (!cards.length) { feed.innerHTML = `<div class="empty">${escapeHtml(t.empty)}</div>`; return; }

      feed.innerHTML = cards.map(c => {
        const v = valueOf(c.value);
        return `
          <article class="card">
            <header class="card-header">
              <div class="avatar" style="background:${avatarColor(c.from)}">${escapeHtml(initials(c.from))}</div>
              <div class="card-meta">
                <div class="card-from"><strong>${escapeHtml(c.from)}</strong><span class="to">→</span><strong>${escapeHtml(c.to)}</strong></div>
                <div class="card-time">${escapeHtml(timeLabel(c.when))}</div>
              </div>
            </header>
            <span class="card-value" style="background:${v.color}1f;color:${v.color}">${v.icon} ${escapeHtml(t[v.key])}</span>
            <p class="card-story">${escapeHtml(loc(c, 'story'))}</p>
            ${c.image ? `<img class="card-thumb" src="${escapeHtml(c.image)}" alt="" data-img="${escapeHtml(c.image)}">` : ''}
            <footer class="card-footer">
              <button class="reaction ${c.reacted ? 'on' : ''}" data-card="${c.id}">❤ ${c.reactions}</button>
            </footer>
          </article>
        `;
      }).join('');
    }

    function render() { renderHero(); renderFeed(); updateResetBtn(); }

    function updateResetBtn() {
      const btn = document.getElementById('reset-cards');
      if (btn) btn.hidden = !CARDS.some(c => c.userCreated);
    }

    // --- Modal ---
    let pendingImage = null; // downscaled data-URL for the card being composed

    // Downscale to keep localStorage under its ~5MB cap: max 800px, JPEG q0.72.
    function processImageFile(file) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith('image/')) { reject(); return; }
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const MAX = 800;
            let { width, height } = img;
            if (width > MAX || height > MAX) {
              const scale = MAX / Math.max(width, height);
              width = Math.round(width * scale);
              height = Math.round(height * scale);
            }
            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.72));
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function setPreview(dataUrl) {
      pendingImage = dataUrl;
      const wrap = document.getElementById('image-preview');
      if (dataUrl) {
        document.getElementById('image-preview-img').src = dataUrl;
        wrap.classList.add('show');
      } else {
        wrap.classList.remove('show');
        document.getElementById('image-input').value = '';
      }
    }

    function openModal() {
      selectedValue = null;
      pendingImage = null;
      setPreview(null);
      const sel = document.getElementById('recipient');
      sel.innerHTML = PEOPLE.filter(n => n !== ME).map(n => `<option>${escapeHtml(n)}</option>`).join('');
      const grid = document.getElementById('value-grid');
      grid.innerHTML = VALUES.map(v => `<button type="button" class="value-pill" data-value="${v.id}" style="--v:${v.color}">${v.icon} ${escapeHtml(t[v.key])}</button>`).join('');
      document.getElementById('story').value = '';
      document.getElementById('confirm-send').disabled = true;
      document.getElementById('modal').hidden = false;
    }
    function closeModal() { document.getElementById('modal').hidden = true; }

    function checkValid() {
      const story = document.getElementById('story').value.trim();
      document.getElementById('confirm-send').disabled = !(selectedValue && story);
    }

    function submitCard() {
      const to = document.getElementById('recipient').value;
      const story = document.getElementById('story').value.trim();
      if (!selectedValue || !story) return;
      const card = {
        id: Date.now(), from: ME, to, value: selectedValue, story,
        when: new Date(), reactions: 0, reacted: false, userCreated: true
      };
      if (pendingImage) card.image = pendingImage;
      CARDS.unshift(card);
      try {
        saveUserCards();
      } catch (e) {
        showToast('Saved for this session (image too large to persist)');
      }
      closeModal();
      render();
      showToast(t.thanks);
    }

    function showToast(msg) {
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2400);
    }

    // --- Lightbox ---
    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').hidden = false;
    }
    function closeLightbox() {
      document.getElementById('lightbox').hidden = true;
      document.getElementById('lightbox-img').src = '';
    }

    // --- Events ---
    document.addEventListener('click', e => {
      const tab = e.target.closest('.cw-tab');
      if (tab) {
        activeTab = tab.dataset.tab;
        document.querySelectorAll('.cw-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === activeTab));
        renderFeed();
        return;
      }
      const rxn = e.target.closest('.reaction');
      if (rxn) {
        const card = CARDS.find(c => c.id === Number(rxn.dataset.card));
        if (card.reacted) { card.reactions = Math.max(0, card.reactions - 1); card.reacted = false; }
        else { card.reactions++; card.reacted = true; }
        if (card.userCreated) { try { saveUserCards(); } catch (err) {} }
        renderFeed();
        return;
      }
      // Open lightbox from a card thumbnail
      const thumb = e.target.closest('.card-thumb');
      if (thumb) {
        openLightbox(thumb.dataset.img);
        return;
      }
      if (e.target.id === 'lightbox' || e.target.id === 'lightbox-close') { closeLightbox(); return; }
      // Compose: pick / remove image
      if (e.target.closest('#pick-image')) { document.getElementById('image-input').click(); return; }
      if (e.target.id === 'image-remove') { setPreview(null); return; }
      if (e.target.closest('#open-send')) { openModal(); return; }
      if (e.target.id === 'reset-cards') {
        localStorage.removeItem(STORE_KEY);
        // Drop user-created cards from the in-memory set without a reload.
        for (let i = CARDS.length - 1; i >= 0; i--) {
          if (CARDS[i].userCreated) CARDS.splice(i, 1);
        }
        render();
        updateResetBtn();
        return;
      }
      if (e.target.id === 'cancel-send') { closeModal(); return; }
      if (e.target.id === 'modal') { closeModal(); return; }
      if (e.target.id === 'confirm-send') { submitCard(); return; }
      const pill = e.target.closest('.value-pill');
      if (pill) {
        selectedValue = pill.dataset.value;
        document.querySelectorAll('.value-pill').forEach(p => p.classList.toggle('selected', p.dataset.value === selectedValue));
        checkValid();
      }
    });

    document.addEventListener('input', e => {
      if (e.target.id === 'story') checkValid();
    });

    document.addEventListener('change', e => {
      if (e.target.id === 'image-input') {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        processImageFile(file)
          .then(setPreview)
          .catch(() => showToast('Could not read that image'));
      }
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if (!document.getElementById('lightbox').hidden) closeLightbox();
        else if (!document.getElementById('modal').hidden) closeModal();
      }
    });

    // --- Init ---
    applyTranslations();
    render();
  </script>
</body>
</html>
