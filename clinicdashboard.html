<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mayo Stats Widget</title>
<style>
  :root {
    --primary: #2563eb;
    --success: #16a34a;
    --warning: #d97706;
    --danger: #dc2626;
    --purple: #7c3aed;
    --bg: #ffffff;
    --card-bg: #f8fafc;
    --border: #e2e8f0;
    --text: #0f172a;
    --text-muted: #64748b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .stats-widget {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
  }

  .stats-container {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .stats-header h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 4px 0;
    color: var(--text);
  }

  .shimmer-blue {
    color: var(--primary);
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    text-decoration: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
    opacity: 0;
    transform: translateY(8px) scale(0.98);
    transition: opacity 0.4s ease, transform 0.4s ease;
    min-width: 0;
  }

  .stat-card.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .stat-card a,
  .stat-card > a {
    text-decoration: none;
    color: inherit;
  }

  .stat-icon {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .stat-icon svg { width: 16px; height: 16px; }

  .stat-icon-blue   { background: color-mix(in srgb, var(--primary) 15%, white); color: var(--primary); }
  .stat-icon-green  { background: color-mix(in srgb, var(--success) 15%, white); color: var(--success); }
  .stat-icon-amber  { background: color-mix(in srgb, var(--warning) 15%, white); color: var(--warning); }
  .stat-icon-purple { background: color-mix(in srgb, var(--purple) 15%, white); color: var(--purple); }

  .stat-value {
    display: flex;
    align-items: baseline;
    gap: 4px;
  }

  .stat-number {
    font-size: 22px;
    font-weight: 700;
    line-height: 1;
    color: var(--text);
  }

  .stat-unit {
    font-size: 12px;
    color: var(--text-muted);
  }

  .stat-label {
    margin: 0;
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .stat-card a:hover .stat-label {
    color: var(--primary);
    text-decoration: underline;
  }

  .training-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .training-card.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .training-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 4px;
  }

  .training-title {
    font-size: 15px;
    font-weight: 700;
    margin: 0;
  }

  .training-count {
    font-size: 12px;
    color: var(--text-muted);
    margin: 0;
  }

  .training-count span {
    font-weight: 700;
    color: var(--text);
  }

  .progress-container { margin-bottom: 12px; }

  .progress-bar-bg {
    width: 100%;
    height: 8px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    width: 0%;
    background: var(--primary);
    border-radius: 999px;
    transition: width 1.1s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .progress-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 11px;
    color: var(--text-muted);
  }

  .progress-labels .highlight {
    color: var(--primary);
    font-weight: 600;
  }

  .module-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .module-item {
    display: flex;
    align-items: center;
    gap: 8px;
    opacity: 0;
    transform: translateX(-8px);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }

  .module-item.visible {
    opacity: 1;
    transform: translateX(0);
  }

  .module-check {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .module-check-done {
    background: color-mix(in srgb, var(--success) 18%, white);
    color: var(--success);
  }

  .module-check-done svg { width: 11px; height: 11px; }

  .module-check-pending {
    border: 2px solid var(--border);
    background: transparent;
  }

  .module-name {
    flex: 1;
    font-size: 13px;
  }

  .module-name-done { color: var(--text); }
  .module-name-pending { color: var(--text-muted); }

  .module-status {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
  }

  .status-done {
    color: var(--success);
    background: color-mix(in srgb, var(--success) 12%, white);
  }

  .status-pending {
    color: var(--text-muted);
    background: var(--border);
  }

  @media (max-width: 360px) {
    .stats-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-number { font-size: 19px; }
  }
</style>
</head>
<body>

<div class="stats-widget">
  <div class="stats-container">

    <div class="stats-header reveal visible" data-reveal>
      <h1>Your <span class="shimmer-blue">Dashboard</span></h1>
    </div>

    <div class="stats-grid">

            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"></path>
          </svg>
        </div>

      <a href="https://learninghub.mayo.edu/" target="_blank" class="stat-card reveal-scale delay-2" data-reveal data-animate-number>
        <div class="stat-icon stat-icon-green">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.436 60.436 0 00-.491 6.347A48.627 48.627 0 0112 20.904a48.627 48.627 0 018.232-4.41 60.46 60.46 0 00-.491-6.347m-15.482 0a50.57 50.57 0 00-2.658-.813A59.905 59.905 0 0112 3.493a59.902 59.902 0 0110.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.697 50.697 0 0112 13.489a50.702 50.702 0 017.74-3.342M6.75 15a.75.75 0 100-1.5.75.75 0 000 1.5zm0 0v-3.675A55.378 55.378 0 0112 8.443m-7.007 11.55A5.981 5.981 0 006.75 15.75v-1.5"></path>
          </svg>
        </div>
        <div class="stat-value">
          <span class="stat-number" data-value="42">0</span>
          <span class="stat-unit">credits</span>
        </div>
        <p class="stat-label">CME Credits</p>
      </a>

      <a href="https://isu.incentiveservices.com/MayoClinic/" target="_blank" class="stat-card reveal-scale delay-3" data-reveal data-animate-number>
        <div class="stat-icon stat-icon-amber">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z"></path>
          </svg>
        </div>
        <div class="stat-value">
          <span class="stat-number" data-value="7">0</span>
        </div>
        <p class="stat-label">Recognitions</p>
      </a>

      <a href="https://ce.mayo.edu/user/login" target="_blank" class="stat-card reveal-scale delay-4" data-reveal data-animate-number>
        <div class="stat-icon stat-icon-purple">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
        </div>
        <div class="stat-value">
          <span class="stat-number" data-value="80">0</span>
          <span class="stat-unit">%</span>
        </div>
        <p class="stat-label">Trainings Done</p>
      </a>

    </div>

    <div class="training-card reveal delay-2" data-reveal data-animate-progress>
      <div class="training-header">
        <h2 class="training-title">Training Progress</h2>
        <p class="training-count"><span>12</span> / 15 completed</p>
      </div>

      <div class="progress-container">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBar" style="width: 0%;"></div>
        </div>
        <div class="progress-labels">
          <span class="highlight">80% Complete</span>
          <span>3 remaining</span>

      </div>

      <div class="module-list">
        <div class="module-item reveal-left delay-1" data-reveal>
          <div class="module-check module-check-done">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
            </svg>
          </div>
          <span class="module-name module-name-done">Patient Safety</span>
          <span class="module-status status-done">Done</span>
        </div>

        <div class="module-item reveal-left delay-2" data-reveal>
          <div class="module-check module-check-done">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
            </svg>
          </div>
          <span class="module-name module-name-done">HIPAA Compliance</span>
          <span class="module-status status-done">Done</span>
        </div>

        <div class="module-item reveal-left delay-3" data-reveal>
          <div class="module-check module-check-done">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
            </svg>
          </div>
          <span class="module-name module-name-done">Emergency Protocols</span>
          <span class="module-status status-done">Done</span>
        </div>

        <div class="module-item reveal-left delay-4" data-reveal>
          <div class="module-check module-check-pending"></div>
          <span class="module-name module-name-pending">Leadership Excellence</span>
          <span class="module-status status-pending">Pending</span>
        </div>

        <div class="module-item reveal-left delay-5" data-reveal>
          <div class="module-check module-check-pending"></div>
          <span class="module-name module-name-pending">Digital Health Tools</span>
          <span class="module-status status-pending">Pending</span>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  (function() {

    // --- Branding hook ---
    // Reads a `brand` query param off the widget URL, e.g.
    // ...clinicdashboard.html?brand=%23A7DBDE  (the %23 is a URL-encoded #)
    // and applies it as --primary. Falls back to --sb-brand (CSS var set by
    // a Staffbase host page) if no query param is present, then to the
    // built-in default.
    function applySBBrand() {
      try {
        var params = new URLSearchParams(window.location.search);
        var brand = params.get('brand');
        if (brand) {
          document.documentElement.style.setProperty('--primary', decodeURIComponent(brand));
          return;
        }
      } catch (e) {}

      try {
        var sb = getComputedStyle(document.documentElement).getPropertyValue('--sb-brand').trim();
        if (sb) {
          document.documentElement.style.setProperty('--primary', sb);
          return;
        }
        sb = window.parent.getComputedStyle(window.parent.document.documentElement)
              .getPropertyValue('--sb-brand').trim();
        if (sb) document.documentElement.style.setProperty('--primary', sb);
      } catch (e) {
        // cross-origin or no parent — keep default --primary
      }
    }

    function animateValue(element, end, duration) {
      var startTime = performance.now();
      function update(currentTime) {
        var elapsed = currentTime - startTime;
        var progress = Math.min(elapsed / duration, 1);
        var eased = 1 - Math.pow(1 - progress, 3);
        element.textContent = Math.floor(end * eased);
        if (progress < 1) requestAnimationFrame(update);
      }
      requestAnimationFrame(update);
    }

    function initScrollAnimations() {
      var observerOptions = { root: null, rootMargin: '0px', threshold: 0.1 };

      var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            var el = entry.target;
            el.classList.add('visible');

            if (el.hasAttribute('data-animate-number')) {
              var numberEl = el.querySelector('.stat-number');
              if (numberEl && numberEl.dataset.value) {
                var value = parseInt(numberEl.dataset.value, 10);
                setTimeout(function() { animateValue(numberEl, value, 1200); }, 200);
              }
            }

            if (el.hasAttribute('data-animate-progress')) {
              var progressBar = el.querySelector('.progress-bar-fill');
              if (progressBar) {
                setTimeout(function() { progressBar.style.width = '80%'; }, 300);
              }
            }

            observer.unobserve(el);
          }
        });
      }, observerOptions);

      document.querySelectorAll('[data-reveal]').forEach(function(el) {
        observer.observe(el);
      });
    }

    function init() {
      applySBBrand();
      initScrollAnimations();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
</script>

</body>
</html>
