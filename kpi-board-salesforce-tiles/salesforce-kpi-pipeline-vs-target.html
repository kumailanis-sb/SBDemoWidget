<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="widget-name" content="Salesforce Tile - Pipeline Value vs Target">
	<title>Pipeline Value vs Target</title>
	<style>
		:root { --primary: var(--sb-brand, #2563eb); --text: #111827; --muted: #6b7280; --bg: #f3f6fb; --surface: #ffffff; --border: #dbe3ef; --shadow: 0 18px 42px rgba(15, 23, 42, 0.08); }
		@media (prefers-color-scheme: dark) { :root { --primary: var(--sb-brand, #60a5fa); --text: #f8fafc; --muted: #94a3b8; --bg: #0f172a; --surface: #111c31; --border: #24324a; --shadow: 0 18px 42px rgba(2, 6, 23, 0.35); } }
		* { box-sizing: border-box; }
		body { margin: 0; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); }
		.card { max-width: 720px; margin: 0 auto; padding: 22px; border-radius: 24px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); }
		.header { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
		h1 { margin: 0; font-size: 22px; }
		.updated { margin-top: 8px; color: var(--muted); font-size: 13px; font-weight: 600; }
		select { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font: inherit; background: transparent; color: inherit; }
		svg { width: 100%; height: auto; margin-top: 16px; display: block; }
		.link { margin-top: 12px; display: inline-flex; gap: 8px; color: var(--primary); text-decoration: none; font-weight: 800; }
	</style>
</head>
<body>
	<article class="card">
		<div class="header">
			<div><h1 id="title">Pipeline Value vs Target</h1><div class="updated"><span id="updated-label">Last updated:</span> <span id="updated-value"></span></div></div>
			<select id="period-select"></select>
		</div>
		<svg id="chart" viewBox="0 0 640 340" role="img"></svg>
		<a class="link" href="#" id="link">View full pipeline report <span aria-hidden="true">→</span></a>
	</article>
	<script>
		const LANG = (() => { const language = navigator.language || ''; if (language.startsWith('de')) return 'de'; if (language.startsWith('fr')) return 'fr'; if (language.startsWith('es')) return 'es'; if (language.startsWith('ja')) return 'ja'; if (language === 'en-GB') return 'en-GB'; return 'en-US'; })();
		document.documentElement.lang = LANG;
		const LOCALE = { de: 'de-DE', fr: 'fr-FR', es: 'es-ES', ja: 'ja-JP', 'en-GB': 'en-GB', 'en-US': 'en-US' }[LANG];
		const CURRENCY = { de: 'EUR', fr: 'EUR', es: 'EUR', ja: 'JPY', 'en-GB': 'GBP', 'en-US': 'USD' }[LANG];
		const HOUR12 = LANG === 'en-GB' || LANG === 'en-US';
		const T = {
			de: { title: 'Pipeline-Wert vs. Ziel', updatedLabel: 'Zuletzt aktualisiert:', link: 'Vollständigen Pipeline-Bericht ansehen', targetLabel: 'gegen Ziel', today: 'Heute', current: 'Dieses Quartal', next: 'Nächstes Quartal', ytd: 'Geschäftsjahr bisher', updatedAt: '${dayLabel}, ${timeLabel}' },
			fr: { title: 'Valeur du pipeline vs objectif', updatedLabel: 'Derniere mise a jour :', link: 'Voir le rapport complet du pipeline', targetLabel: 'vs objectif', today: 'Aujourd\'hui', current: 'Ce trimestre', next: 'Trimestre suivant', ytd: 'Depuis le debut de l\'annee', updatedAt: '${dayLabel}, ${timeLabel}' },
			es: { title: 'Valor del pipeline vs objetivo', updatedLabel: 'Ultima actualizacion:', link: 'Ver informe completo del pipeline', targetLabel: 'vs objetivo', today: 'Hoy', current: 'Este trimestre', next: 'Proximo trimestre', ytd: 'Ano en curso', updatedAt: '${dayLabel}, ${timeLabel}' },
			ja: { title: 'Pipeline Value vs Target', updatedLabel: 'Last updated:', link: 'View full pipeline report', targetLabel: 'vs target', today: 'Today', current: 'This Quarter', next: 'Next Quarter', ytd: 'FY To Date', updatedAt: '${dayLabel}, ${timeLabel}' },
			'en-GB': { title: 'Pipeline Value vs Target', updatedLabel: 'Last updated:', link: 'View full pipeline report', targetLabel: 'vs target', today: 'Today', current: 'This Quarter', next: 'Next Quarter', ytd: 'FY To Date', updatedAt: '${dayLabel}, ${timeLabel}' },
			'en-US': { title: 'Pipeline Value vs Target', updatedLabel: 'Last updated:', link: 'View full pipeline report', targetLabel: 'vs target', today: 'Today', current: 'This Quarter', next: 'Next Quarter', ytd: 'FY To Date', updatedAt: '${dayLabel}, ${timeLabel}' }
		};
		const t = T[LANG] || T['en-US'];
		const DATA = {
			current: { updatedAt: '2026-04-23T08:30:00', target: 20.0, monthly: [{ label: 'Apr', value: 19.1 }, { label: 'May', value: 22.3 }, { label: 'Jun', value: 24.6 }] },
			next: { updatedAt: '2026-04-23T09:10:00', target: 22.0, monthly: [{ label: 'Jul', value: 24.3 }, { label: 'Aug', value: 26.7 }, { label: 'Sep', value: 27.8 }] },
			ytd: { updatedAt: '2026-04-23T10:05:00', target: 58.0, monthly: [{ label: 'Jan', value: 17.4 }, { label: 'Feb', value: 21.9 }, { label: 'Mar', value: 24.1 }, { label: 'Apr', value: 63.4 }] }
		};
		const periodOptions = [{ id: 'current', label: () => t.current }, { id: 'next', label: () => t.next }, { id: 'ytd', label: () => t.ytd }];
		const compactCurrencyFormatter = new Intl.NumberFormat(LOCALE, { style: 'currency', currency: CURRENCY, notation: 'compact', maximumFractionDigits: CURRENCY === 'JPY' ? 0 : 1 });
		const timeFormatter = new Intl.DateTimeFormat(LOCALE, { hour: 'numeric', minute: '2-digit', hour12: HOUR12 });
		const state = { selectedPeriod: 'current' };
		function tr(key, vars = {}) { let text = t[key] || key; Object.entries(vars).forEach(([name, value]) => { text = text.replace(`\${${name}}`, value); }); return text; }
		function applySBBrand() { let sbBrand = getComputedStyle(document.documentElement).getPropertyValue('--sb-brand').trim(); if (!sbBrand) { try { sbBrand = getComputedStyle(window.parent.document.documentElement).getPropertyValue('--sb-brand').trim(); } catch (error) { sbBrand = ''; } } if (sbBrand) document.documentElement.style.setProperty('--primary', sbBrand); }
		function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
		function mixColor(colorA, colorB, ratio) { const a = hexToRgb(colorA); const b = hexToRgb(colorB); if (!a || !b) return colorA; return `rgb(${Math.round(a.r + (b.r - a.r) * ratio)}, ${Math.round(a.g + (b.g - a.g) * ratio)}, ${Math.round(a.b + (b.b - a.b) * ratio)})`; }
		function hexToRgb(value) { if (!value.startsWith('#')) return null; let hex = value.slice(1); if (hex.length === 3) hex = hex.split('').map((part) => part + part).join(''); if (hex.length !== 6) return null; const int = parseInt(hex, 16); return { r: (int >> 16) & 255, g: (int >> 8) & 255, b: int & 255 }; }
		function formatCurrency(value) { return compactCurrencyFormatter.format(value * 1000000); }
		function render() {
			const data = DATA[state.selectedPeriod];
			document.title = t.title;
			document.getElementById('title').textContent = t.title;
			document.getElementById('updated-label').textContent = t.updatedLabel;
			document.getElementById('updated-value').textContent = tr('updatedAt', { dayLabel: t.today, timeLabel: timeFormatter.format(new Date(data.updatedAt)) });
			document.getElementById('link').firstChild.textContent = `${t.link} `;
			const select = document.getElementById('period-select');
			select.innerHTML = periodOptions.map((option) => `<option value="${option.id}">${option.label()}</option>`).join('');
			select.value = state.selectedPeriod;
			const width = 640;
			const height = 340;
			const padding = { top: 20, right: 16, bottom: 50, left: 58 };
			const innerWidth = width - padding.left - padding.right;
			const innerHeight = height - padding.top - padding.bottom;
			const maxValue = Math.max(...data.monthly.map((item) => item.value), data.target) * 1.18;
			const gap = innerWidth / data.monthly.length;
			const barWidth = gap * 0.48;
			const yFor = (value) => padding.top + innerHeight - (value / maxValue) * innerHeight;
			const targetY = yFor(data.target);
			const axisValues = [0, maxValue / 3, (maxValue / 3) * 2, maxValue].map((value) => Math.round(value));
			const axis = axisValues.map((value) => { const y = yFor(value); return `<line x1="${padding.left}" y1="${y}" x2="${width - padding.right}" y2="${y}" stroke="${cssVar('--border')}"/><text x="${padding.left - 12}" y="${y + 5}" text-anchor="end" font-size="13" font-weight="700" fill="${cssVar('--muted')}">${formatCurrency(value)}</text>`; }).join('');
			const bars = data.monthly.map((item, index) => { const x = padding.left + gap * index + (gap - barWidth) / 2; const y = yFor(item.value); return `<g><rect x="${x}" y="${y}" width="${barWidth}" height="${padding.top + innerHeight - y}" rx="8" fill="url(#barGradient)"></rect><text x="${x + barWidth / 2}" y="${y - 10}" text-anchor="middle" font-size="15" font-weight="800" fill="${cssVar('--text')}">${formatCurrency(item.value)}</text><text x="${x + barWidth / 2}" y="${height - 14}" text-anchor="middle" font-size="15" font-weight="700" fill="${cssVar('--muted')}">${item.label}</text></g>`; }).join('');
			document.getElementById('chart').innerHTML = `<defs><linearGradient id="barGradient" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="${cssVar('--primary')}"></stop><stop offset="100%" stop-color="${mixColor(cssVar('--primary'), '#1e40af', 0.48)}"></stop></linearGradient></defs>${axis}<line x1="${padding.left}" y1="${targetY}" x2="${width - padding.right}" y2="${targetY}" stroke="${cssVar('--muted')}" stroke-dasharray="7 7"/><text x="${width - padding.right}" y="${targetY - 10}" text-anchor="end" font-size="13" font-weight="800" fill="${cssVar('--muted')}">${t.targetLabel} ${formatCurrency(data.target)}</text>${bars}`;
		}
		document.getElementById('period-select').addEventListener('change', (event) => { state.selectedPeriod = event.target.value; render(); });
		applySBBrand();
		render();
	</script>
</body>
</html>
