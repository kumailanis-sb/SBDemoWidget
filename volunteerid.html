<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Volunteer ID Card</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }

  :root {
    --sa-red: #E31837;
    --sa-red-dark: #A81026;
    --sa-navy: #1B1F3B;
    --sa-gold: #F2A900;
    --sa-grey: #6b6f76;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #eceef1;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 32px 16px;
  }

  .card {
    width: 340px;
    background: #ffffff;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    border: 1px solid #e2e2e2;
  }

  /* Header */
  .card-header {
    background: #ffffff;
    padding: 16px 18px 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #f0f0f0;
  }

  .logo {
    width: 44px;
    height: auto;
    flex-shrink: 0;
  }

  .header-text {
    line-height: 1.25;
  }

  .header-text .org-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--sa-navy);
    letter-spacing: 0.3px;
  }

  .header-text .card-type {
    font-size: 11px;
    font-weight: 600;
    color: var(--sa-red);
    margin-top: 2px;
  }

  .gold-strip {
    height: 4px;
    background: var(--sa-gold);
  }

  /* Body */
  .card-body {
    padding: 20px 18px 8px;
    display: flex;
    gap: 14px;
  }

  .photo {
    width: 78px;
    height: 92px;
    border-radius: 8px;
    background: #f1f1f3;
    border: 1px solid #dcdcdc;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .photo svg {
    width: 40px;
    height: 40px;
    stroke: #b7bac0;
  }

  .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
    display: block;
  }

  .details {
    flex: 1;
    min-width: 0;
  }

  .name {
    font-size: 17px;
    font-weight: 700;
    color: var(--sa-navy);
    margin: 0 0 2px;
    line-height: 1.25;
  }

  .role {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--sa-red);
    margin: 0 0 10px;
  }

  .field {
    margin-bottom: 6px;
  }

  .field-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--sa-grey);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin: 0;
  }

  .field-value {
    font-size: 12.5px;
    color: var(--sa-navy);
    margin: 0;
    font-weight: 500;
  }

  /* Divider */
  .divider {
    border: none;
    border-top: 1px dashed #dcdcdc;
    margin: 14px 18px 0;
  }

  /* Footer */
  .card-footer {
    padding: 12px 18px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .id-block .field-label {
    margin-bottom: 2px;
  }

  .id-number {
    font-size: 13px;
    font-weight: 700;
    color: var(--sa-navy);
    letter-spacing: 0.5px;
  }

  .qr-wrap {
    width: 58px;
    height: 58px;
    border-radius: 6px;
    border: 1px solid #dcdcdc;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #ffffff;
  }

  .qr-wrap img, .qr-wrap canvas {
    width: 100% !important;
    height: 100% !important;
    display: block;
  }

  .tagline {
    text-align: center;
    font-size: 10px;
    color: var(--sa-grey);
    padding: 0 18px 16px;
    font-style: italic;
  }
</style>
</head>
