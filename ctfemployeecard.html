<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chow Tai Fook employee card (demo)</title>
<style>
  :root{
    --ctf-red:#BC0000;--ctf-red-deep:#8A0000;--ink:#2a1a1a;--muted:#7a6a6a;--line:#ecdcdc;
    --sans:Optima,Candara,"Segoe UI","Trebuchet MS",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
  /* Simplified Chinese: prefer CJK system fonts and Simplified glyph variants */
  html:lang(zh-CN){--sans:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}
  body{display:flex;justify-content:center;padding:16px}

  /* Stage is the size container: everything inside scales with the card width */
  .stage{width:100%;max-width:560px;container-type:inline-size}

  .card{
    display:grid;grid-template-columns:31% 1fr;aspect-ratio:1.6/1;width:100%;
    background:#fff;border-radius:2.6cqw;overflow:hidden;
    box-shadow:0 10px 30px rgba(120,0,0,.18),0 1px 3px rgba(0,0,0,.08);
  }

  /* Brand panel */
  .face{
    background:var(--ctf-red);color:#fff;text-align:center;
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:5.5cqw 2cqw 5cqw;
  }
  .wordmark{font-size:clamp(9px,2.2cqw,13px);font-weight:400;letter-spacing:.18em;text-indent:.18em;white-space:nowrap}
  .photo{
    width:clamp(72px,19cqw,112px);aspect-ratio:1;border-radius:50%;
    border:.9cqw solid #fff;background:#eee center/cover no-repeat;
    box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  .badge{
    padding:.8cqw 2.4cqw;border-radius:999px;white-space:nowrap;
    font-size:clamp(8.5px,1.9cqw,11px);letter-spacing:.05em;background:rgba(255,255,255,.18);color:#fff;
  }

  /* Details panel */
  .main{display:flex;flex-direction:column;padding:5cqw 5cqw 4.5cqw 4.5cqw;min-width:0}
  .id{padding-bottom:2.4cqw;border-bottom:1px solid var(--line)}
  .name{font-size:clamp(15px,4.4cqw,24px);font-weight:600;letter-spacing:.02em;line-height:1.2}
  .role{margin-top:.8cqw;font-size:clamp(11.5px,2.7cqw,15px);color:var(--ctf-red);letter-spacing:.02em}
  .dept{margin-top:.2cqw;font-size:clamp(10.5px,2.4cqw,13px);color:var(--muted)}
  .name.is-empty,.role.is-empty{color:var(--muted);font-weight:400}

  .body{flex:1;display:grid;grid-template-columns:1fr auto;gap:3cqw;align-items:center;padding-top:1.5cqw;min-height:0}
  dl{min-width:0}
  .row{display:flex;justify-content:space-between;gap:2cqw;padding:.9cqw 0;font-size:clamp(10px,2.25cqw,12.5px)}
  .row dt{color:var(--muted);flex:none}
  .row dd{text-align:right;overflow-wrap:anywhere;min-width:0}
  .row a{color:inherit;text-decoration:none}
  .row a:hover,.row a:focus-visible{color:var(--ctf-red);text-decoration:underline}
  .row[hidden]{display:none}

  .qr{text-align:center}
  .qr-box{display:inline-block;padding:1.2cqw;background:#fff;border:1px solid var(--line);border-radius:1.6cqw;line-height:0}
  .qr-box svg{width:clamp(80px,19cqw,108px);height:auto;aspect-ratio:1;display:block}
  .qr-cap{margin-top:1cqw;font-size:clamp(8.5px,1.9cqw,10.5px);color:var(--muted);line-height:1.3;max-width:19cqw;min-width:80px;margin-inline:auto}


  /* Very narrow embeds: keep the two-column landscape feel but let height grow and drop QR below details */
  @container (max-width:430px){
    .card{aspect-ratio:auto}
    .body{grid-template-columns:1fr;justify-items:stretch;gap:3cqw}
    .qr{padding-top:1cqw}
    .badge{white-space:normal;padding:.8cqw 1.6cqw;font-size:9px;line-height:1.25}
  }
</style>
</head>
<body>
<div class="stage">
<main class="card" aria-label="Chow Tai Fook employee digital card">
  <aside class="face">
    <div class="wordmark" id="wordmark">CHOW TAI FOOK</div>
    <div class="photo" id="photo" role="img" aria-label="Employee photo"></div>
    <span class="badge" id="badge">Staff discount member</span>
  </aside>

  <section class="main">
    <div class="id">
      <h1 class="name is-empty" id="f-name">Employee name</h1>
      <p class="role is-empty" id="f-title">Job title</p>
      <p class="dept" id="f-dept" hidden></p>
    </div>

    <div class="body">
      <div>
        <dl>
          <div class="row" id="r-id" hidden><dt id="l-id">Employee ID</dt><dd id="f-id"></dd></div>
          <div class="row" id="r-loc" hidden><dt id="l-loc">Location</dt><dd id="f-loc"></dd></div>
          <div class="row" id="r-email" hidden><dt id="l-email">Email</dt><dd><a id="f-email"></a></dd></div>
          <div class="row" id="r-phone" hidden><dt id="l-phone">Phone</dt><dd><a id="f-phone"></a></dd></div>
        </dl>
      </div>
      <div class="qr">
        <div class="qr-box" id="qr" role="img" aria-label="QR code for this employee's contact details"></div>
        <p class="qr-cap" id="qr-cap">Scan to save contact details</p>
      </div>
    </div>
  </section>
</main>
</div>

<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);

        var b2 = read();

        if (c < 128) {
          bytes.push(c);

  function $(i){return document.getElementById(i)}
  function clean(v){return (v||'').toString().replace(/[\r\n]+/g,' ').trim().slice(0,120)}

  function readParams(){
    var p = new URLSearchParams(location.search);
    KEYS.forEach(function(k){ var v = clean(p.get(k)); if(v){ data[k]=v; explicit[k]=1; } });
  }

  function vcard(d){
    function esc(s){return s.replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,')}
    var l = ['BEGIN:VCARD','VERSION:3.0'];
    var fn = d.name || t.fn, family, given;
    if(/^[\u3400-\u9fff]{2,}$/.test(fn)){ family = fn.charAt(0); given = fn.slice(1); }
    else { var parts = fn.split(' '); family = parts.length>1 ? parts.pop() : ''; given = parts.join(' '); }
    l.push('N:'+esc(family)+';'+esc(given)+';;;');
    l.push('FN:'+esc(fn));
    l.push('ORG:'+esc(t.org)+(d.dept?';'+esc(d.dept):''));
    if(d.title) l.push('TITLE:'+esc(d.title));
    if(d.email) l.push('EMAIL;TYPE=WORK:'+esc(d.email));
    if(d.phone) l.push('TEL;TYPE=WORK,VOICE:'+esc(d.phone));
    if(d.loc)   l.push('ADR;TYPE=WORK:;;'+esc(d.loc)+';;;;');
    l.push('END:VCARD');
    return l.join('\r\n');
  }

  function setText(id,val,rowId){
    var el=$(id), row=rowId?$(rowId):null;
    if(val){ el.textContent=val; if(row) row.hidden=false; if(!row) el.hidden=false; }
    else { if(row) row.hidden=true; }
  }

  function render(){
    applyLang();
    if(data.name){ $('f-name').textContent=data.name; $('f-name').classList.remove('is-empty'); }
    if(data.title){ $('f-title').textContent=data.title; $('f-title').classList.remove('is-empty'); }
    setText('f-dept',data.dept);
    setText('f-id',data.id,'r-id');
    setText('f-loc',data.loc,'r-loc');
    if(data.email){ var e=$('f-email'); e.textContent=data.email; e.href='mailto:'+data.email; $('r-email').hidden=false; } else $('r-email').hidden=true;
    if(data.phone){ var p=$('f-phone'); p.textContent=data.phone; p.href='tel:'+data.phone.replace(/[^\d+]/g,''); $('r-phone').hidden=false; } else $('r-phone').hidden=true;

    var hasContact = !!(data.name || data.email || data.phone);
    var payload = hasContact ? vcard(data) : FALLBACK_URL;
    drawQR(payload);
    $('qr-cap').textContent = hasContact ? t.qrSave : t.qrVisit;
  }

  function drawQR(text){
    try{
      var qr = qrcode(0,'M');
      qr.addData(text,'Byte');
      qr.make();
      var svg = qr.createSvgTag({cellSize:4,margin:0,scalable:true});
      // Tint modules deep brand red; keep high contrast for scanning
      svg = svg.replace('<path ','<path fill="#5a0000" ');
      $('qr').innerHTML = svg;
    }catch(err){
      $('qr').textContent = 'QR code unavailable';
    }
  }


  window.addEventListener('message',function(ev){
    var m=ev.data; if(!m || m.type!=='ctf-card') return;
    if(m.lang) lang = pickLang(clean(m.lang));
    KEYS.forEach(function(k){ var v=clean(m[k]); if(v){ data[k]=v; explicit[k]=1; } });
    syncDefaults();
    render();
  });

  readParams();
  render();
})();
</script>
</body>
</html>
